<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp · Local demo</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><nav class="rail" aria-label="Main navigation"><button class="selected" title="Chats" aria-label="Chats" data-action="chats">♧</button><button title="Starred messages" aria-label="Starred messages" data-action="starred">☆</button><div class="rail-bottom"><button title="Toggle theme" aria-label="Toggle theme" data-action="theme">◐</button><button class="avatar me" title="About this demo" aria-label="About this demo" data-action="about">AB</button></div></nav>
<aside class="sidebar"><header class="list-head"><h1>WhatsApp <span>DEMO</span></h1><button aria-label="New chat" title="New chat" data-action="new">▢＋</button></header><label class="search"><span>⌕</span><input id="search" placeholder="Search or start a new chat" autocomplete="off"></label><div class="filters"><button class="active" data-filter="All">All</button><button data-filter="Unread">Unread</button><button data-filter="Favorites">Favorites</button><button data-filter="Groups">Groups</button></div><button class="archive" data-action="archive"><span>▣</span> Archived <small id="archive-count"></small></button><div id="chat-list"></div><footer class="list-footer">⌁ Your chats stay in this browser</footer></aside>
<main class="conversation"><header class="chat-head"><button class="mobile-back" aria-label="Back to chats" data-action="back">‹</button><button id="contact" class="contact" data-action="info"></button><div class="head-actions"><button aria-label="Search messages" title="Search messages" data-action="find">⌕</button><button aria-label="Conversation menu" title="Conversation menu" data-action="menu">⋮</button></div></header><div id="message-search" hidden><input placeholder="Search in conversation" aria-label="Search in conversation"><button data-action="close-find" aria-label="Close search">×</button></div><section id="messages" aria-label="Messages" aria-live="polite"></section><div id="emoji" hidden></div><form id="composer"><button type="button" aria-label="Choose emoji" title="Choose emoji" data-action="emoji">☺</button><button type="button" aria-label="Attach file" title="Attach file" data-action="attach">＋</button><input id="draft" placeholder="Type a message" aria-label="Type a message" autocomplete="off"><button class="send" type="submit" aria-label="Send message" title="Send message">➤</button></form><input type="file" id="file" hidden></main>
<aside id="info" hidden></aside></div><div id="toast" role="status"></div><dialog id="dialog"><form method="dialog"><button class="close" aria-label="Close dialog">×</button></form><div id="dialog-content"></div></dialog><script src="app.js"></script></body></html>
